#
# ============================================================================
# AI STAGE TEMPLATES - Claude Code Integration
# ============================================================================
#
# Reference templates for AI-assisted development jobs using Claude Code CLI
# and GitLab MCP server for enhanced GitLab API operations.
#
# Usage: Copy desired templates to ci/ai.gitlab-ci.yml and customize variables
#
# Required Variables (set in GitLab CI/CD settings):
#   - ANTHROPIC_API_KEY: Claude API key for AI operations (required)
#
# Optional Variables (feature flags):
#   - ENABLE_AI_REVIEW: Set to "true" to enable automatic AI reviews on MRs
#   - ENABLE_AI_ARCHITECTURE: Set to "true" to enable architecture analysis
#   - ENABLE_AI_TEST_ANALYSIS: Set to "true" for automatic test failure analysis
#   - ENABLE_AI_PIPELINE_DEBUG: Set to "true" for automatic pipeline debugging
#
# Optional Variables (configuration):
#   - CLAUDE_MODEL: AI model to use (default: claude-sonnet-4)
#   - CLAUDE_DEBUG: Set to "true" for verbose output
#   - CLAUDE_PERMISSION_MODE: Permission mode (default: viewOnly)
#   - AI_FLOW_INPUT: Custom prompt (overrides defaults)
#   - AI_FLOW_CONTEXT: Additional context information
#   - AI_FLOW_EVENT: Event type information
#
# ============================================================================

# Base template for Claude Code jobs
.claude-code-base:
  image: node:24-alpine3.21
  variables:
    GIT_STRATEGY: fetch
    GIT_DEPTH: 0  # Full history for better AI context
    CLAUDE_MODEL: "claude-sonnet-4"
    CLAUDE_DEBUG: "false"
    GITLAB_MCP_ENABLED: "true"
  before_script:
    - echo "Setting up Claude Code environment..."
    - apk update
    - apk add --no-cache git curl bash jq
    - npm install -g @anthropic-ai/claude-code
    # Setup helper scripts
    - chmod +x ci/scripts/ai-flow-runner.sh || echo "ai-flow-runner.sh not found"
    - chmod +x ci/scripts/mcp-server-setup.sh || echo "mcp-server-setup.sh not found"
  artifacts:
    paths:
      - "ai_*.md"
      - "*.ai.log"
    expire_in: 1 week
    when: always
  allow_failure: true  # AI jobs never block pipeline
  timeout: 10 minutes

#
# AI Review Stage - Early code review before build
#

ai_code_review:
  extends: .claude-code-base
  stage: ai-review
  script:
    - echo "Starting AI-powered code review..."
    # Setup GitLab MCP server (optional)
    - |
      if [ "$GITLAB_MCP_ENABLED" = "true" ] && [ -f ci/scripts/mcp-server-setup.sh ]; then
        ci/scripts/mcp-server-setup.sh || echo "⚠ MCP server setup skipped"
      fi
    # Prepare review prompt
    - |
      REVIEW_PROMPT="${AI_FLOW_INPUT:-"Review this merge request and provide detailed feedback:

      1. **Code Quality**: Check adherence to best practices and coding standards
      2. **Potential Issues**: Identify bugs, security vulnerabilities, or performance problems
      3. **Architecture**: Assess design patterns and SOLID principles
      4. **Documentation**: Verify code comments and documentation completeness
      5. **Testing**: Review test coverage and test quality
      6. **Conventions**: Check compliance with project coding standards

      Focus on files changed in this MR.
      Provide actionable, specific feedback with code examples when applicable.

      Context: ${AI_FLOW_CONTEXT:-MR !${CI_MERGE_REQUEST_IID} - Code Review}
      Event: ${AI_FLOW_EVENT:-merge_request_event}"}"
    # Run Claude Code with restricted permissions
    - |
      echo "Running Claude Code review..."
      claude \
        -p "$REVIEW_PROMPT" \
        --permission-mode viewOnly \
        --allowedTools "Read(*) Grep(*) Glob(*) mcp__gitlab" \
        ${CLAUDE_DEBUG:+--debug} \
        > ai_review.md 2> ai_review.ai.log || {
          echo "❌ Claude Code execution failed"
          cat ai_review.ai.log
          exit 1
        }
    # Post results to MR as comment
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ] && [ -f ai_review.md ]; then
        echo "Posting review to MR !${CI_MERGE_REQUEST_IID}..."
        REVIEW_BODY="## 🤖 AI Code Review

$(cat ai_review.md)

---
*Generated by Claude Code in pipeline [#${CI_PIPELINE_ID}](${CI_PIPELINE_URL})*"

        curl -s -X POST \
          --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$(jq -n --arg body "$REVIEW_BODY" '{body: $body}')" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
          && echo "✅ Review posted to MR" \
          || echo "⚠ Failed to post review to MR"
      fi
  rules:
    # Automatic on MR if explicitly enabled
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $ENABLE_AI_REVIEW == "true"'
      when: always
    # Manual on MR otherwise
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    # Automatic on web pipeline with explicit flag
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_AI_REVIEW == "true"'
      when: always

ai_architecture_analysis:
  extends: .claude-code-base
  stage: ai-review
  script:
    - echo "Analyzing project architecture..."
    - |
      if [ "$GITLAB_MCP_ENABLED" = "true" ] && [ -f ci/scripts/mcp-server-setup.sh ]; then
        ci/scripts/mcp-server-setup.sh || echo "⚠ MCP server setup skipped"
      fi
    - |
      ARCH_PROMPT="Analyze the architecture and design of this project:

      1. **Module Structure**: Review package organization and dependencies
      2. **Design Patterns**: Identify patterns used and their appropriateness
      3. **SOLID Principles**: Check adherence to SOLID principles
      4. **Best Practices**: Verify use of project-specific patterns
      5. **Scalability**: Assess potential scaling issues
      6. **Maintainability**: Evaluate code maintainability and technical debt

      Focus on files changed in this MR and their impact on overall architecture.

      Context: Architecture review for ${CI_PROJECT_NAME}"
    - |
      claude \
        -p "$ARCH_PROMPT" \
        --permission-mode viewOnly \
        --allowedTools "Read(*) Grep(*) Glob(*) mcp__gitlab" \
        ${CLAUDE_DEBUG:+--debug} \
        > ai_architecture.md 2> ai_arch.ai.log || {
          echo "❌ Architecture analysis failed"
          cat ai_arch.ai.log
          exit 1
        }
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ] && [ -f ai_architecture.md ]; then
        ARCH_BODY="## 🏗️ AI Architecture Analysis

$(cat ai_architecture.md)

---
*Generated by Claude Code in pipeline [#${CI_PIPELINE_ID}](${CI_PIPELINE_URL})*"

        curl -s -X POST \
          --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$(jq -n --arg body "$ARCH_BODY" '{body: $body}')" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
          && echo "✅ Analysis posted to MR" \
          || echo "⚠ Failed to post analysis to MR"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $ENABLE_AI_ARCHITECTURE == "true"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_AI_ARCHITECTURE == "true"'
      when: always

#
# AI Assist Stage - Post-build assistance and debugging
#

ai_test_failure_analysis:
  extends: .claude-code-base
  stage: ai-assist
  needs:
    - job: "unit test"
      artifacts: true
      optional: true
  script:
    - echo "Analyzing test failures..."
    - |
      if [ ! -d "build/test-results" ] && [ ! -d "build/reports/tests" ]; then
        echo "⚠ No test results found, skipping analysis"
        exit 0
      fi
    - |
      FAILURE_PROMPT="Analyze the test failures in this pipeline:

      1. **Failed Tests**: Review test failure messages and stack traces
      2. **Root Causes**: Identify underlying causes of failures
      3. **Fix Suggestions**: Provide specific code fixes with examples
      4. **Prevention**: Suggest improvements to prevent similar failures

      Test results are in:
      - build/test-results/ (JUnit XML)
      - build/reports/tests/ (HTML reports)

      Provide actionable fixes with code snippets.

      Context: Test failure analysis for pipeline #${CI_PIPELINE_ID}"
    - |
      if [ -f ci/scripts/mcp-server-setup.sh ]; then
        ci/scripts/mcp-server-setup.sh || echo "⚠ MCP server setup skipped"
      fi
    - |
      claude \
        -p "$FAILURE_PROMPT" \
        --permission-mode viewOnly \
        --allowedTools "Read(*) Grep(*) Glob(*) Bash(ls cat grep find)" \
        ${CLAUDE_DEBUG:+--debug} \
        > ai_test_analysis.md 2> ai_test.ai.log || {
          echo "❌ Test analysis failed"
          cat ai_test.ai.log
          exit 1
        }
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ] && [ -f ai_test_analysis.md ]; then
        TEST_BODY="## 🧪 AI Test Failure Analysis

$(cat ai_test_analysis.md)

---
*Generated by Claude Code in pipeline [#${CI_PIPELINE_ID}](${CI_PIPELINE_URL})*"

        curl -s -X POST \
          --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$(jq -n --arg body "$TEST_BODY" '{body: $body}')" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
          && echo "✅ Analysis posted to MR" \
          || echo "⚠ Failed to post analysis to MR"
      fi
  rules:
    # Auto-run on test failures if enabled
    - if: '$ENABLE_AI_TEST_ANALYSIS == "true"'
      when: on_failure
    # Otherwise manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_failure
      allow_failure: true

ai_code_generation:
  extends: .claude-code-base
  stage: ai-assist
  script:
    - echo "AI-assisted code generation..."
    - |
      if [ "$GITLAB_MCP_ENABLED" = "true" ] && [ -f ci/scripts/mcp-server-setup.sh ]; then
        ci/scripts/mcp-server-setup.sh || echo "⚠ MCP server setup skipped"
      fi
    - |
      GEN_PROMPT="${AI_FLOW_INPUT:-"Implement the requested feature based on MR description:

      1. **Requirements**: Understand the feature requirements
      2. **Implementation**: Write clean, well-documented code
      3. **Conventions**: Follow project coding standards and patterns
      4. **Testing**: Include unit tests if applicable
      5. **Documentation**: Update relevant documentation

      Use best practices:
      - Service layer for business logic
      - Repository pattern for data access
      - Proper exception handling
      - Comprehensive documentation

      Context: Code generation for ${CI_PROJECT_NAME}
      Event: ${AI_FLOW_EVENT:-web trigger}"}"
    - |
      echo "⚠ WARNING: This job has write permissions and can modify code"
      echo "Running with acceptEdits permission mode..."

      claude \
        -p "$GEN_PROMPT" \
        --permission-mode acceptEdits \
        --allowedTools "Bash(ls cat grep mkdir) Read(*) Edit(*) Write(*) Grep(*) Glob(*) mcp__gitlab" \
        ${CLAUDE_DEBUG:+--debug} \
        > ai_generation.md 2> ai_gen.ai.log || {
          echo "❌ Code generation failed"
          cat ai_gen.ai.log
          exit 1
        }
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ] && [ -f ai_generation.md ]; then
        GEN_BODY="## ⚙️ AI Code Generation

$(cat ai_generation.md)

---
*Generated by Claude Code in pipeline [#${CI_PIPELINE_ID}](${CI_PIPELINE_URL})*
*⚠ Review all generated code carefully before merging*"

        curl -s -X POST \
          --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$(jq -n --arg body "$GEN_BODY" '{body: $body}')" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
          && echo "✅ Generation report posted to MR" \
          || echo "⚠ Failed to post report to MR"
      fi
  rules:
    # Manual only for code generation (requires explicit trigger)
    - if: '$CI_PIPELINE_SOURCE == "web" && $RUN_AI_GENERATION == "true"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true

#
# AI Pipeline Debugging - Runs on pipeline failure (.post stage)
#

ai_pipeline_debug:
  extends: .claude-code-base
  stage: .post
  script:
    - echo "Analyzing pipeline failure..."
    - |
      if [ -f ci/scripts/mcp-server-setup.sh ]; then
        ci/scripts/mcp-server-setup.sh || echo "⚠ MCP server setup skipped"
      fi
    - |
      DEBUG_PROMPT="Analyze this failed pipeline and provide troubleshooting guidance:

      1. **Failed Jobs**: Identify which jobs failed and their error messages
      2. **Root Cause**: Determine the underlying cause of failures
      3. **Fix Steps**: Provide step-by-step resolution guide
      4. **Prevention**: Suggest changes to prevent future failures

      Pipeline Information:
      - Pipeline ID: ${CI_PIPELINE_ID}
      - Pipeline URL: ${CI_PIPELINE_URL}
      - Commit: ${CI_COMMIT_SHA}
      - Branch: ${CI_COMMIT_REF_NAME}

      Use GitLab MCP to access pipeline logs and job details.

      Context: Pipeline failure analysis"
    - |
      claude \
        -p "$DEBUG_PROMPT" \
        --permission-mode viewOnly \
        --allowedTools "Read(*) Grep(*) Bash(ls cat grep) mcp__gitlab" \
        ${CLAUDE_DEBUG:+--debug} \
        > ai_debug.md 2> ai_debug.ai.log || {
          echo "❌ Debug analysis failed"
          cat ai_debug.ai.log
          exit 1
        }
    - |
      if [ -n "${CI_MERGE_REQUEST_IID:-}" ] && [ -f ai_debug.md ]; then
        DEBUG_BODY="## 🔧 AI Pipeline Debug Analysis

$(cat ai_debug.md)

---
*Generated by Claude Code in pipeline [#${CI_PIPELINE_ID}](${CI_PIPELINE_URL})*"

        curl -s -X POST \
          --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$(jq -n --arg body "$DEBUG_BODY" '{body: $body}')" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes" \
          && echo "✅ Debug analysis posted to MR" \
          || echo "⚠ Failed to post analysis to MR"
      fi
  rules:
    # Auto-run on pipeline failure if enabled
    - if: '$ENABLE_AI_PIPELINE_DEBUG == "true"'
      when: on_failure
    # Otherwise run on failure but manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: on_failure
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: on_failure
      allow_failure: true
