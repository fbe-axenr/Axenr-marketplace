# Gradle-Specific CI/CD Patterns for GitLab
# Optimized configurations for Gradle builds with caching and best practices

# ============================================================================
# Complete Pipeline Example - Gradle 8.5 + JDK 17
# ============================================================================

example_complete_gradle_pipeline:
  stages:
    - init
    - build
    - test
    - quality

  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

  cache:
    key:
      files:
        - gradle.lockfile
        - build.gradle
        - settings.gradle
    paths:
      - .gradle/wrapper
      - .gradle/caches

  commitlint:
    stage: init
    image: node:20-alpine
    before_script:
      - npm install --save-dev @commitlint/cli @commitlint/config-conventional
    script:
      - npx commitlint --from ${CI_MERGE_REQUEST_DIFF_BASE_SHA:-HEAD~1} --to HEAD --verbose
    rules:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    allow_failure: false

  build:
    stage: build
    image: gradle:8.5-jdk17-alpine
    script:
      - ./gradlew clean build -x test --info --build-cache
    artifacts:
      paths:
        - build/libs/*.jar
        - build/classes/
      expire_in: 1 week

  test:
    stage: test
    image: gradle:8.5-jdk17-alpine
    script:
      - ./gradlew test jacocoTestReport --info
    coverage: '/Total.*?([0-9]{1,3})%/'
    artifacts:
      when: always
      paths:
        - build/reports/tests/
        - build/reports/jacoco/
      reports:
        junit: build/test-results/test/TEST-*.xml
        coverage_report:
          coverage_format: cobertura
          path: build/reports/jacoco/test/jacocoTestReport.xml

  spotless:
    stage: quality
    image: gradle:8.5-jdk17-alpine
    script:
      - ./gradlew spotlessCheck --info
    allow_failure: false

# ============================================================================
# Cache Configurations
# ============================================================================

# Optimal cache for Gradle (recommended)
cache_optimal:
  key:
    files:
      - gradle.lockfile
      - build.gradle
      - settings.gradle
  paths:
    - .gradle/wrapper      # Gradle wrapper distribution
    - .gradle/caches       # Dependencies and build cache
  policy: pull-push        # Default: both download and upload

# Cache for read-only jobs (test, quality)
cache_readonly:
  key:
    files:
      - gradle.lockfile
  paths:
    - .gradle/wrapper
    - .gradle/caches
  policy: pull             # Only download, don't upload

# Per-branch cache (for feature branches)
cache_per_branch:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .gradle/wrapper
    - .gradle/caches
  policy: pull-push

# ============================================================================
# Build Configurations
# ============================================================================

# Standard build with tests disabled
build_without_tests:
  stage: build
  image: gradle:8.5-jdk17-alpine
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key:
      files:
        - gradle.lockfile
    paths:
      - .gradle/wrapper
      - .gradle/caches
  script:
    - ./gradlew clean build -x test --info
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 1 week

# Build with parallel execution (multi-module projects)
build_parallel:
  stage: build
  image: gradle:8.5-jdk17-alpine
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.workers.max=4"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  script:
    - ./gradlew clean build -x test --parallel --max-workers=4 --info

# Build with build cache enabled
build_with_cache:
  stage: build
  image: gradle:8.5-jdk17-alpine
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  script:
    - ./gradlew clean build -x test --build-cache --info

# ============================================================================
# Test Configurations
# ============================================================================

# Standard test with JaCoCo coverage
test_with_coverage:
  stage: test
  image: gradle:8.5-jdk17-alpine
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false"
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key:
      files:
        - gradle.lockfile
    paths:
      - .gradle/caches
    policy: pull
  script:
    - ./gradlew test jacocoTestReport --info
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    paths:
      - build/reports/tests/
      - build/reports/jacoco/
    reports:
      junit: build/test-results/test/TEST-*.xml
      coverage_report:
        coverage_format: cobertura
        path: build/reports/jacoco/test/jacocoTestReport.xml
    expire_in: 1 week

# Test with coverage threshold enforcement
test_with_threshold:
  stage: test
  image: gradle:8.5-jdk17-alpine
  script:
    - ./gradlew test jacocoTestCoverageVerification --info
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    when: always
    reports:
      junit: build/test-results/test/TEST-*.xml

# Integration tests (separate job)
integration_test:
  stage: test
  image: gradle:8.5-jdk17-alpine
  services:
    - postgres:15-alpine
  variables:
    POSTGRES_DB: test_db
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    DATABASE_URL: "jdbc:postgresql://postgres:5432/test_db"
  script:
    - ./gradlew integrationTest --info
  artifacts:
    when: always
    paths:
      - build/reports/tests/integrationTest/
    reports:
      junit: build/test-results/integrationTest/TEST-*.xml

# ============================================================================
# Quality Stage Configurations
# ============================================================================

# Spotless formatting check
spotless_check:
  stage: quality
  image: gradle:8.5-jdk17-alpine
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  cache:
    key:
      files:
        - gradle.lockfile
    paths:
      - .gradle/caches
    policy: pull
  script:
    - ./gradlew spotlessCheck --info
  allow_failure: false  # BLOCKING

# Spotless auto-fix (for non-MR pipelines)
spotless_apply:
  stage: quality
  image: gradle:8.5-jdk17-alpine
  script:
    - ./gradlew spotlessApply --info
  artifacts:
    paths:
      - src/
    expire_in: 1 hour
  rules:
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
  when: manual

# SonarQube analysis
sonarqube_analysis:
  stage: quality
  image: gradle:8.5-jdk17-alpine
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"  # Full clone for better analysis
  cache:
    - key:
        files:
          - gradle.lockfile
      paths:
        - .gradle/caches
      policy: pull
    - key: "${CI_COMMIT_REF_SLUG}-sonar"
      paths:
        - .sonar/cache
  script:
    - ./gradlew sonarqube
        -Dsonar.host.url=$SONAR_HOST_URL
        -Dsonar.login=$SONAR_TOKEN
        -Dsonar.projectKey=$CI_PROJECT_NAME
        -Dsonar.projectName=$CI_PROJECT_NAME
        -Dsonar.branch.name=$CI_COMMIT_REF_NAME
  allow_failure: true
  rules:
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Dependency vulnerability check
dependency_check:
  stage: quality
  image: gradle:8.5-jdk17-alpine
  script:
    - ./gradlew dependencyCheckAnalyze --info
  artifacts:
    paths:
      - build/reports/dependency-check-report.html
    expire_in: 1 week
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - when: manual

# ============================================================================
# Image Versions Reference
# ============================================================================

# Recommended Gradle+JDK combinations:
# - gradle:8.5-jdk17-alpine (Recommended for new projects)
# - gradle:8.5-jdk11-alpine (Legacy projects)
# - gradle:7.6-jdk17-alpine (Stable LTS)
# - gradle:8.5-jdk21-alpine (Latest JDK, experimental)

# Best practices:
# - Always use specific versions (not 'latest')
# - Use alpine variants for smaller image sizes
# - Match JDK version with project requirements

